<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="menubarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#242426"/>
    </linearGradient>
    <linearGradient id="desktopGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4b6cb7"/>
      <stop offset="100%" stop-color="#182848"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- デスクトップ背景 -->
  <rect x="0" y="0" width="640" height="260" fill="url(#desktopGrad)"/>

  <!-- メニューバー -->
  <rect x="0" y="0" width="640" height="28" fill="url(#menubarGrad)"/>
  <text x="16" y="19" fill="#e5e5e7" font-size="13" font-weight="500">🏠</text>

  <!-- 右側メニューバーアイコン群（Wi-Fi等のダミー） -->
  <g fill="#c7c7cc" font-size="13">
    <text x="360" y="19">🔋</text>
    <text x="392" y="19">📶</text>
  </g>

  <!-- 本ツールのメニューバー表示 -->
  <rect x="424" y="4" width="196" height="20" rx="4" fill="#3f3f42"/>
  <text x="434" y="19" fill="#ffffff" font-size="13" font-weight="600">📊 28% (2分前) ⏱4h30m</text>

  <!-- ドロップダウンメニュー -->
  <g filter="url(#dropShadow)">
    <rect x="330" y="34" width="290" height="120" rx="10" fill="#2c2c2e"/>
    <rect x="330" y="34" width="290" height="120" rx="10" fill="none" stroke="#48484a" stroke-width="1"/>

    <!-- 詳細行 -->
    <text x="352" y="66" fill="#f2f2f7" font-size="13">使用量: 28% | リセットまで: 4h30m</text>
    <text x="352" y="86" fill="#8e8e93" font-size="12">使用量: 正確 (CLI)</text>

    <!-- セパレータ -->
    <line x1="344" y1="102" x2="606" y2="102" stroke="#48484a" stroke-width="1"/>

    <!-- 終了行 -->
    <text x="352" y="128" fill="#f2f2f7" font-size="13">終了</text>
  </g>

  <!-- キャプション -->
  <text x="16" y="248" fill="#ffffff" font-size="14" font-weight="600" opacity="0.9">macOS メニューバー表示イメージ</text>
</svg>
